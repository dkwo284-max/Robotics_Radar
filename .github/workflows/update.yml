name: Robotics Radar update

# 매일 아침 뉴스·주가를 모으고(Gemini 내 보장량 3회 + 허브 공유 예비분 이내) 화면 데이터를 다시 만들어 GitHub Pages 로 배포합니다.
#   UTC 19:10 = 뉴질랜드 오전 8시대(서머타임) / 한국 새벽 4시대
# GitHub 예약 실행은 붐비면 몇 시간씩 늦거나 건너뛰는 일이 있어서, 같은 UTC 날짜 안에 예비 시각을 3번 더 둡니다.
# check 잡이 "오늘 19:10 UTC 이후에 이미 갱신됐는지" 보고, 갱신됐으면 예비 실행은 수집·배포 없이 곧바로 끝냅니다.
# 큐레이션 데이터(data/*.json)나 코드를 푸시하면 수집 없이 빌드만 다시 합니다(커밋 메시지에 [collect] 가 있으면 수집도 함께 실행).
# 논문 신호(arXiv)는 키 없이 6일 지난 층만 갱신합니다. EPO 특허 집계는 선택 기능으로 꺼져 있습니다(README 참고).
on:
  schedule:
    - cron: "10 19 * * *"
    - cron: "40 20 * * *"
    - cron: "10 22 * * *"
    - cron: "40 23 * * *"
  workflow_dispatch:
    inputs:
      news:
        description: "뉴스·AI 분류도 함께 (false 면 주가 + 빌드만)"
        default: "true"
  push:
    branches: [main]
    paths: ["data/**", "scripts/**", "web/**", "!web/data/**", "tests/**", "config.json", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: web/data
          sparse-checkout-cone-mode: false
      - id: g
        run: |
          run=true
          if [ -f web/data/dashboard.json ]; then
            gen=$(python3 -c "import json; print(json.load(open('web/data/dashboard.json')).get('generated_at', ''))" || true)
            if [ -n "$gen" ] && g=$(date -u -d "$gen" +%s 2>/dev/null) && [ "$g" -ge "$(date -u -d 'today 19:10' +%s)" ]; then
              run=false
              echo "already updated at $gen; skipping"
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  update:
    needs: check
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.check.outputs.run == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - run: python scripts/build.py --check
      - name: Collect (schedule · manual · push with [collect])
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[collect]')
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/update.py ${{ github.event.inputs.news == 'false' && '--no-news' || '' }}
      - name: Build only (push)
        if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[collect]')
        run: python scripts/build.py
      - name: Commit data
        run: |
          git config user.name "robotics-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data data/history.json data/state.json data/changes.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: web }

  deploy:
    needs: update
    if: ${{ needs.update.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
